<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utmaning i Klokr!</title>
  <meta name="theme-color" content="#070C26">
  <meta property="og:title" content="Du har blivit utmanad i Klokr!">
  <meta property="og:description" content="Samma tolv frågor. Högst IQ vinner.">
  <meta property="og:image" content="https://klokr.se/assets/icon-192.webp">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/klokr.css">
  <script src="/assets/neural.js" defer></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

  <main class="center">
    <div class="glass panel">
      <div class="brain-stage" data-brain>
        <div class="halo"></div><div class="iris"></div><div class="iris2"></div>
        <div class="spark" style="--dx:70px;--dy:-60px"></div>
        <div class="spark" style="--dx:-80px;--dy:-30px;animation-delay:1.2s"></div>
      </div>
      <div class="label" data-t="label">Utmana en vän</div>
      <h1 data-t="title">Du har blivit utmanad!</h1>
      <p data-t="body">Den här länken öppnar en utmaning i <strong>Klokr</strong>. Ni får samma frågor, och högst IQ vinner.</p>
      <p data-t="hint" style="font-size:14px;color:var(--muted)">Öppnas inte appen av sig själv? Tryck på knappen.</p>
      <a href="#" id="openAppBtn" class="btn btn-primary" data-t="open">Öppna utmaningen i appen</a>
      <a href="https://play.google.com/store/apps/details?id=se.klokr.app" class="btn btn-ghost" data-t="play">Hämta Klokr på Google Play</a>
    </div>
  </main>

  <script>
    (function () {
      var EN = {
        label: "Challenge a friend",
        title: "You've been challenged!",
        body: "This link opens a challenge in <strong>Klokr</strong>. You both get the same questions, and the highest IQ wins.",
        hint: "Doesn't the app open by itself? Tap the button.",
        open: "Open the challenge in the app",
        play: "Get Klokr on Google Play"
      };
      var lang = (navigator.language || navigator.userLanguage || "").toLowerCase();
      if (lang.indexOf("sv") !== 0) {
        document.documentElement.lang = "en";
        document.title = "Challenge in Klokr!";
        document.querySelectorAll("[data-t]").forEach(function (n) { n.innerHTML = EN[n.getAttribute("data-t")]; });
      }

      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var level = params.get("level");
      var play = "https://play.google.com/store/apps/details?id=se.klokr.app";
      var btn = document.getElementById("openAppBtn");

      if (id) {
        // Intent-länk med id (och nivå för äldre utmaningar) och reserv till Google Play
        var levelParam = level ? "&level=" + encodeURIComponent(level) : "";
        var intentLink = "intent://klokr.se/challenge?id=" + encodeURIComponent(id) + levelParam +
          "#Intent;scheme=https;package=se.klokr.app;S.browser_fallback_url=" + play + ";end;";
        btn.href = intentLink;
        // Försök öppna appen automatiskt efter en halv sekund
        setTimeout(function () { window.location.href = intentLink; }, 500);
      } else {
        btn.style.display = "none";
        document.querySelector('[data-t="hint"]').style.display = "none";
      }
    })();
  </script>
</body>
</html>
